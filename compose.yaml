services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loghmeh
      POSTGRES_USER: loghmeh
      POSTGRES_PASSWORD: loghmeh_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loghmeh -d loghmeh"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:

